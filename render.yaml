# Blueprint Render: 1 web service persistente (Express + Socket.IO + OutboxWorker
# rodam no mesmo processo Node). Deploy: New → Blueprint → aponta este repositório.
# Env vars sync=false você preenche no dashboard.
#
# NÃO usamos `generateValue: true` porque na prática o Render as vezes não gera
# no primeiro apply, deixando o serviço subindo com env faltando (ver zod check
# em src/config/env.ts). Em vez disso, geramos localmente:
#     openssl rand -hex 32
# e colamos como JWT_SECRET no dashboard.
#
# NÃO setamos PORT — Render injeta automaticamente na porta interna do container.
# O env.ts default (3000) só é usado em dev.
#
# Migrations: rodar localmente contra o Neon UMA vez por versão de schema:
#     DATABASE_URL='postgres://...neon.tech/...' npm run migrate
#     DATABASE_URL='...' npm run seed   # opcional, cria tenant summer + admin
# (o worker de migração via container não vale a pena — tsx é devDep, não vem
#  no runtime image; validado no smoke local, mais barato rodar da sua máquina.)

services:
  - type: web
    name: summer-drinks-atendimento
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # cole postgres://user:pass@ep-xxx.neon.tech/db?sslmode=require
      - key: JWT_SECRET
        sync: false        # cole `openssl rand -hex 32` (64 chars hex)
      - key: JWT_EXP_SEGUNDOS
        value: "900"
      - key: CORS_ORIGINS
        sync: false        # https://summer-drinks-cliente.vercel.app (domínio do PWA)
      # WhatsApp real: troque NOTIF_DRIVER p/ 'green' e preencha as GREEN_API_*
      # no dashboard (instância + token da green-api.com). Com 'fake' nada é
      # enviado (o env.ts recusa 'green' sem credenciais no boot).
      - key: NOTIF_DRIVER
        value: fake
      - key: NOTIF_WORKER
        value: "true"
      - key: GREEN_API_BASE_URL
        value: https://api.green-api.com   # ou a URL da SUA instância (ex.: https://1103.api.green-api.com)
      - key: GREEN_API_ID_INSTANCE
        sync: false        # idInstance da instância Green API
      - key: GREEN_API_TOKEN
        sync: false        # apiTokenInstance — segredo, só no dashboard
      - key: SEED_ADMIN_SENHA
        sync: false        # senha do admin (usada só por scripts/seed local)
      - key: PUBLIC_RATE_PEDIDO_MAX
        value: "20"
      - key: PUBLIC_RATE_EVENTO_MAX
        value: "5"
      - key: PUBLIC_RATE_AGENDA_STATUS_MAX
        value: "120"
      - key: PUBLIC_RATE_AVALIACAO_MAX
        value: "10"
      - key: PUBLIC_RATE_JANELA_MS
        value: "60000"
